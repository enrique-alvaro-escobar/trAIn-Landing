<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<title>2trAIn · Overlay · Instagram Stories</title>
<meta name="robots" content="noindex" />

<style>
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/assets/fonts/archivo/archivo-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Vitoria';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('/assets/fonts/vitoria/vitoria-400-normal.woff2') format('woff2');
  }

  :root {
    --fg: #FFFFFF;
    --muted: rgba(255,255,255,0.82);
    --accent: #2A6FDB;
    --accent-2: #6BA0FF;
    /* Soft shadow so text stays legible on any photo */
    --tshadow: 0 2px 16px rgba(0,0,0,0.6), 0 1px 3px rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #0b0b0c;
    color: var(--fg);
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .display { font-family: 'Vitoria', 'Archivo', serif; font-weight: 400; letter-spacing: -0.01em; line-height: 0.94; }

  /* ===== Stage / preview ===== */
  .stage {
    display: flex; flex-direction: column; align-items: center;
    gap: 24px; padding: 36px 20px 60px;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
    max-width: 560px; text-align: center;
  }
  .toolbar p { width: 100%; color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.5; }
  .btn {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    border: 0; border-radius: 999px; padding: 13px 24px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px; transition: transform .15s ease, box-shadow .2s ease;
    box-shadow: 0 8px 24px -8px rgba(42,111,219,0.6);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -10px rgba(42,111,219,0.7); }
  .btn.ghost { background: #161616; color: var(--fg); border: 1px solid rgba(255,255,255,0.16); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent-2); color: var(--accent-2); }

  /* The 9:16 canvas. Real export size = 1080 x 1920; scaled down for the screen. */
  .card-scaler {
    width: 360px;            /* 1080 / 3 */
    height: 640px;           /* 1920 / 3 */
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.8);
    /* Checkerboard = indicates transparency, like Strava's preview */
    background-color: #2b2b2e;
    background-image:
      linear-gradient(45deg, #3a3a3e 25%, transparent 25%),
      linear-gradient(-45deg, #3a3a3e 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #3a3a3e 75%),
      linear-gradient(-45deg, transparent 75%, #3a3a3e 75%);
    background-size: 36px 36px;
    background-position: 0 0, 0 18px, 18px -18px, -18px 0;
  }
  /* Sample photo shown ONLY in the on-screen preview, never exported */
  .photo-bg {
    position: absolute; inset: 0; opacity: 0; transition: opacity .25s ease;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.3)),
      url('/social/preview-photo.png');
    background-size: cover; background-position: center;
  }
  .card-scaler.show-photo .photo-bg { opacity: 1; }

  /* ===== The overlay itself (designed at 1080x1920, TRANSPARENT) ===== */
  .card {
    width: 1080px; height: 1920px;
    transform: scale(0.3333333);
    transform-origin: top left;
    position: absolute; top: 0; left: 0;
    background: transparent;     /* exported PNG keeps full transparency */
    overflow: hidden;
    padding: 150px 90px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    color: var(--fg);
  }

  /* small badge at top, like Strava's TRANSPARENT chip but branded */
  .o-flag {
    align-self: center;
    font-size: 26px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase;
    color: #fff; text-shadow: var(--tshadow);
    border: 3px solid rgba(255,255,255,0.55); border-radius: 16px;
    padding: 14px 26px;
  }

  .o-name { margin-top: 64px; font-size: 96px; color: #fff; text-shadow: var(--tshadow); }
  .o-session { margin-top: 18px; font-size: 38px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-2); text-transform: uppercase; text-shadow: var(--tshadow); }

  /* Centered, stacked stats: small label above, huge value below (Strava style) */
  .o-stats {
    margin-top: 96px; display: flex; flex-direction: column; align-items: center; gap: 64px;
  }
  .o-stat { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .o-stat .k { font-size: 34px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); text-shadow: var(--tshadow); }
  .o-stat .v { font-size: 150px; font-weight: 800; line-height: 0.9; color: #fff; text-shadow: var(--tshadow); }
  .o-stat .v .u { font-size: 64px; font-weight: 700; color: var(--accent-2); margin-left: 10px; }

  /* Thin progress bar */
  .o-progress { width: 560px; margin-top: 104px; }
  .o-progress .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .o-progress .row .t { font-size: 32px; font-weight: 700; color: #fff; text-shadow: var(--tshadow); }
  .o-progress .row .pct { font-size: 36px; font-weight: 800; color: var(--accent-2); text-shadow: var(--tshadow); }
  .o-track { height: 16px; background: rgba(255,255,255,0.28); border-radius: 999px; overflow: hidden; }
  .o-fill { height: 100%; width: 80%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 26px rgba(42,111,219,0.6); }

  /* Logo pinned at the very bottom, like STRAVA wordmark */
  .o-logo { margin-top: auto; height: 64px; width: auto; display: block; filter: drop-shadow(0 2px 14px rgba(0,0,0,0.7)); }

  @media (max-width: 420px) {
    .card-scaler { width: 320px; height: 569px; }
    .card { transform: scale(0.296296); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="toolbar">
      <p>Overlay transparente 9:16 para Instagram Stories. El cuadriculado indica transparencia: el PNG se exporta con fondo transparente (1080&times;1920&nbsp;px) para colocarlo sobre tu foto.</p>
      <button class="btn" id="download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
        Descargar PNG transparente
      </button>
      <button class="btn ghost" id="toggle">Previsualizar sobre foto</button>
    </div>

    <div class="card-scaler" id="scaler">
      <div class="photo-bg" aria-hidden="true"></div>
      <div class="card" id="card">
        <div class="o-flag">Entreno completado</div>

        <h1 class="o-name display">Carlos</h1>
        <div class="o-session">Empuje · Pecho &amp; Hombro</div>

        <div class="o-stats">
          <div class="o-stat">
            <div class="k">Ejercicios</div>
            <div class="v">6</div>
          </div>
          <div class="o-stat">
            <div class="k">Series</div>
            <div class="v">22</div>
          </div>
          <div class="o-stat">
            <div class="k">Duración</div>
            <div class="v">58<span class="u">min</span></div>
          </div>
        </div>

        <div class="o-progress">
          <div class="row">
            <div class="t">Objetivo semanal</div>
            <div class="pct">80%</div>
          </div>
          <div class="o-track"><div class="o-fill" style="width:80%"></div></div>
        </div>

        <img class="o-logo" src="/assets/logo3.png" alt="2trAIn" crossorigin="anonymous" />
      </div>
    </div>
  </div>

  <script src="/social/html-to-image.js"></script>
  <script>
    const btn = document.getElementById('download');
    const card = document.getElementById('card');
    const scaler = document.getElementById('scaler');
    const toggle = document.getElementById('toggle');

    toggle.addEventListener('click', () => {
      const on = scaler.classList.toggle('show-photo');
      toggle.textContent = on ? 'Ver transparencia' : 'Previsualizar sobre foto';
    });

    btn.addEventListener('click', async () => {
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Generando…';
      try {
        const dataUrl = await htmlToImage.toPng(card, {
          width: 1080,
          height: 1920,
          pixelRatio: 1,
          cacheBust: true,
          // No backgroundColor => transparent PNG
          style: { transform: 'none', top: '0', left: '0' },
        });
        const a = document.createElement('a');
        a.download = '2train-overlay.png';
        a.href = dataUrl;
        a.click();
      } catch (e) {
        console.log('[v0] export error:', e && e.message);
        alert('No se pudo exportar la imagen. Inténtalo de nuevo.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
  </script>
</body>
</html>
